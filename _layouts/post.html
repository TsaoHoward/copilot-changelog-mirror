---
layout: default
---
<nav><a href="{{ '/' | relative_url }}">← All posts</a></nav>
<article>
  <h1>{{ page.title | replace: '-', ' ' | replace: '_', ' ' | capitalize | escape }}</h1>
  <dl>
    <dt>Source</dt>
    <dd><a href="{{ page.source_url | escape }}">{{ page.source_url | escape }}</a></dd>
    {% if page.published_at %}
    <dt>Published</dt>
    <dd>{{ page.published_at | escape }}</dd>
    {% endif %}
    <dt>Archived</dt>
    <dd>{{ page.fetched_at | escape }}</dd>
  </dl>
  <hr>
  <div class="article-content">{{ content }}</div>
</article>
