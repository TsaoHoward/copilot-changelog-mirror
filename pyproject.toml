[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-changelog-mirror"
version = "0.1.0"
description = "Manually mirror the GitHub Copilot Changelog to Markdown"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
copilot-mirror = "copilot_mirror:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["copilot_mirror"]
