[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-changelog-mirror"
version = "0.1.0"
description = "Capture and archive the GitHub Copilot Changelog"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "markdownify>=1.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[project.scripts]
copilot-mirror = "copilot_mirror:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["copilot_mirror"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
