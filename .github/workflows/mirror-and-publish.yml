name: Mirror and publish Copilot Changelog

on:
  schedule:
    - cron: "17 6,12 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-and-publish
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Fetch existing archive history
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/mirror-data >/dev/null; then
            git fetch origin mirror-data:refs/remotes/origin/mirror-data
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "Remote mirror-data branch does not exist yet; the mirror will create it."
            else
              exit "$status"
            fi
          fi

      - name: Configure archive commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Copilot mirror
        run: uv run copilot-mirror

      - name: Push archive branch
        run: git push origin mirror-data

  publish:
    needs: mirror
    uses: ./.github/workflows/publish-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
