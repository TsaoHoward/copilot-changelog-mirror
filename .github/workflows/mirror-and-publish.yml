name: Capture Copilot Changelog snapshots

on:
  schedule:
    - cron: "17 6,12 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-copilot-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch existing archive history
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/mirror-data >/dev/null; then
            git fetch origin mirror-data:refs/remotes/origin/mirror-data
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "Remote mirror-data branch does not exist yet; the mirror will create it."
            else
              exit "$status"
            fi
          fi

      - name: Configure snapshot commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture raw Copilot Changelog snapshots
        run: python3 src/copilot_mirror.py capture

      - name: Push snapshot branch
        run: git push origin mirror-data
