# Isolated build verification only: this workflow cannot deploy to Pages.
# The complete production chain is staged in .github/v2-production for #24.
name: V2 verification Pages
on:
  workflow_run:
    workflows: [V2 verification render]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      render_run_id:
        description: Exact render run (blank resolves current verified render)
        type: string
        default: ""
      render_attempt:
        description: Exact render attempt (required with run ID)
        type: string
        default: ""
      force:
        description: Bypass only duplicate suppression
        type: boolean
        default: false
      reestablish:
        description: Explicitly recover an established expired successful baseline
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: copilot-archive-v2-verification
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
      preparation_attempt: ${{ steps.bind.outputs.preparation_attempt }}
      artifact_name: ${{ steps.bind.outputs.artifact_name }}
      definition: ${{ github.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ARCHIVE_BRANCH: mirror-data-v2-verification
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: control/.node-version
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install workflow tools
        working-directory: control
        run: npm ci
      - name: Select exact rendered publication
        id: selection
        working-directory: control
        run: >-
          npm run pages -- select --repo . --definition-repo .
          --branch "$DEFAULT_BRANCH" --archive-branch "$ARCHIVE_BRANCH"
          --definition-file .github/v2-pages-build.json --state "$RUNNER_TEMP/pages.json"
      - name: Build selected site
        id: build
        if: steps.selection.outputs.proceed == 'true'
        working-directory: control
        run: >-
          npm run pages -- prepare --repo . --definition-repo .
          --branch "$DEFAULT_BRANCH" --archive-branch "$ARCHIVE_BRANCH"
          --state "$RUNNER_TEMP/pages.json" --output "$RUNNER_TEMP/pages-output"
      - name: Upload Pages artifact
        id: pages
        if: steps.build.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: v2-pages-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-output
          retention-days: 1
      - name: Record preparation
        id: bind
        if: steps.build.outputs.deploy == 'true'
        working-directory: control
        env:
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: >-
          npm run pages -- bind --repo . --definition-repo .
          --branch "$DEFAULT_BRANCH" --archive-branch "$ARCHIVE_BRANCH"
          --state "$RUNNER_TEMP/pages.json" --artifact-id "$ARTIFACT_ID"
      - name: Report preparation outcome
        if: always()
        working-directory: control
        env:
          PAGES_STATUS: ${{ job.status }}
        run: >-
          npm run pages -- report --repo . --definition-repo .
          --branch "$DEFAULT_BRANCH" --archive-branch "$ARCHIVE_BRANCH"
          --state "$RUNNER_TEMP/pages.json"
      - name: Publish preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-pages-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages.json
          if-no-files-found: error
          retention-days: 90
      - name: Report evidence publication outcome
        if: always()
        working-directory: control
        env:
          PAGES_STATUS: ${{ job.status }}
        run: >-
          npm run pages -- report --repo . --definition-repo .
          --branch "$DEFAULT_BRANCH" --archive-branch "$ARCHIVE_BRANCH"
          --state "$RUNNER_TEMP/pages.json"
