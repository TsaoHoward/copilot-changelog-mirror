name: Render archive posts from snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-copilot-posts
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch existing archive history
        run: git fetch origin mirror-data:refs/remotes/origin/mirror-data

      - name: Set up Python dependencies
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Configure archive commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Render saved snapshots
        run: uv run copilot-mirror render

      - name: Push archive branch
        run: git push origin mirror-data
