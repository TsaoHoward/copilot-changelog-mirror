name: Publish archive to GitHub Pages

on:
  workflow_run:
    workflows: [Render archive posts from snapshots]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      render_run_id:
        description: Successful render run ID (blank resolves current archive)
        type: string
        default: ""
      render_attempt:
        description: Exact render attempt (required with run ID)
        type: string
        default: ""
      force:
        description: Redeploy identical current inputs; freshness and evidence still required
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: copilot-archive-production
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Render archive posts from snapshots' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.preparation.outputs.deploy }}
      definition: ${{ github.sha }}
      artifact_id: ${{ steps.pages.outputs.artifact_id }}
      preparation_attempt: ${{ github.run_attempt }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control

      - name: Select exact successful render evidence
        id: selection
        run: python3 control/scripts/production_stage.py select --stage publish --repo control --state "$RUNNER_TEMP/stage.json"

      - name: Check out selected site source
        if: steps.selection.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.application }}
          path: app-source

      - name: Verify freshness and publication inputs
        if: steps.selection.outputs.proceed == 'true'
        id: preparation
        run: python3 control/scripts/production_stage.py prepare --repo app-source --definition-repo control --state "$RUNNER_TEMP/stage.json"

      - name: Check out exact rendered archive
        if: steps.preparation.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.preparation.outputs.archive }}
          path: app-source/archive-source

      - name: Validate and stage archive
        if: steps.preparation.outputs.deploy == 'true'
        working-directory: app-source
        run: python3 scripts/stage_archive.py archive-source/posts _archive

      - name: Set up Ruby
        if: steps.preparation.outputs.deploy == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app-source

      - name: Configure GitHub Pages
        if: steps.preparation.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build site
        if: steps.preparation.outputs.deploy == 'true'
        working-directory: app-source
        env:
          BASEURL: ${{ steps.preparation.outputs.baseurl }}
        run: bundle exec jekyll build --baseurl "$BASEURL"

      - name: Upload Pages artifact
        if: steps.preparation.outputs.deploy == 'true'
        id: pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: app-source/_site

      - name: Summarize publication preparation
        if: always()
        env:
          STAGE_STATUS: ${{ job.status }}
        run: python3 control/scripts/production_stage.py report --state "$RUNNER_TEMP/stage.json"

      - name: Save publication preparation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.definition }}

      - name: Download exact publication preparation
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ needs.build.outputs.preparation_attempt }}
        run: gh run download "$RUN_ID" --name "publication-input-$RUN_ID-$ATTEMPT" --dir "$RUNNER_TEMP"

      - name: Recheck archive before deployment
        id: freshness
        run: python3 scripts/production_stage.py fresh --state "$RUNNER_TEMP/stage.json"

      - name: Deploy Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      - name: Record verified publication
        if: steps.deployment.outcome == 'success'
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/production_stage.py published --state "$RUNNER_TEMP/stage.json"

      - name: Summarize publication outcome
        if: always()
        env:
          STAGE_STATUS: ${{ job.status }}
        run: python3 scripts/production_stage.py report --state "$RUNNER_TEMP/stage.json"

      - name: Save publication outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage.json
          if-no-files-found: error
          retention-days: 90
