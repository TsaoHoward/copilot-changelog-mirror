# TEMPLATE ONLY: kept outside .github/workflows so production cannot register it.
# Install this exact file as .github/workflows/update-publish.yml ONLY in the
# fixed isolated repository. Production activation is a separate #36 decision.
name: Isolated directory update and Pages

on:
  schedule:
    - cron: "17 6,12 * * *"
      timezone: Asia/Taipei
  workflow_dispatch:
    inputs:
      mode:
        description: Saved-source repair or saved-derived publication
        type: choice
        options: [full-update, render-rebuild, republish]
        default: full-update
      application_sha:
        description: Optional full trusted application commit for recovery
        type: string
      archive_sha:
        description: Optional full complete-derived archive commit (republish only)
        type: string

permissions:
  contents: read

concurrency:
  group: isolated-directory-archive-pages
  cancel-in-progress: false
  queue: max

jobs:
  archive-build:
    if: >-
      github.repository == 'TsaoHoward/copilot-changelog-isolated-35' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ARCHIVE_DIR: ${{ github.workspace }}/archive
      # Isolated fixture source only; never production evidence. See the runbook.
      FEED_URL: https://raw.githubusercontent.com/TsaoHoward/copilot-changelog-isolated-35/acceptance-source/feed.xml
      SITE_BASE: /copilot-changelog-isolated-35/
      SITE_ORIGIN: https://tsaohoward.github.io
    steps:
      - name: Check out workflow revision without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Validate entry and select application once
        id: entry
        working-directory: control
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_APPLICATION: ${{ inputs.application_sha }}
          REQUESTED_ARCHIVE: ${{ inputs.archive_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == TsaoHoward/copilot-changelog-isolated-35 ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          case "$GITHUB_EVENT_NAME" in
            schedule) mode=full-update ;;
            workflow_dispatch) mode=${REQUESTED_MODE:-full-update} ;;
            *) exit 1 ;;
          esac
          case "$mode" in full-update|render-rebuild|republish) ;; *) exit 1 ;; esac
          if [[ -n "$REQUESTED_ARCHIVE" && "$mode" != republish ]]; then
            echo 'archive_sha is only valid for republish' >&2
            exit 1
          fi
          [[ -z "$REQUESTED_ARCHIVE" || "$REQUESTED_ARCHIVE" =~ ^[0-9a-f]{40}$ ]]
          application=${REQUESTED_APPLICATION:-$GITHUB_SHA}
          [[ "$application" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$application^{commit}"
          git merge-base --is-ancestor "$application" "refs/remotes/origin/$DEFAULT_BRANCH"
          for file in src/v2/capture-directory-cli.ts src/v2/render-directory-cli.ts src/v2/native-site-cli.ts; do
            git cat-file -e "$application:$file"
          done
          git show "$application:package.json" | jq -e '.scripts | .["capture:directory"] and .["render:directory"] and .["site:build:directory"]' > /dev/null
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "application=$application" >> "$GITHUB_OUTPUT"
          {
            echo "Event: $GITHUB_EVENT_NAME; mode: $mode"
            echo "Workflow revision: $GITHUB_SHA; application revision: $application"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out fixed application
        id: application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.entry.outputs.application }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked application dependencies once
        working-directory: app
        run: npm ci

      # Write credentials are persisted only after the entry guards passed.
      - name: Check out dedicated attached archive
        id: archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mirror-data-v2
          path: archive
          fetch-depth: 0

      - name: Select archive revision once
        id: selected
        working-directory: archive
        env:
          MODE: ${{ steps.entry.outputs.mode }}
          REQUESTED_ARCHIVE: ${{ inputs.archive_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git symbolic-ref --short HEAD) == mirror-data-v2 ]]
          remote=$(git remote get-url origin)
          [[ "$remote" == "https://github.com/$GITHUB_REPOSITORY" || "$remote" == "https://github.com/$GITHUB_REPOSITORY.git" ]]
          if [[ "$MODE" == republish && -n "$REQUESTED_ARCHIVE" ]]; then
            git cat-file -e "$REQUESTED_ARCHIVE^{commit}"
            git merge-base --is-ancestor "$REQUESTED_ARCHIVE" HEAD
            git checkout --detach "$REQUESTED_ARCHIVE"
          fi
          [[ -z $(git status --porcelain --untracked-files=all) ]]
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Selected saved archive: $revision" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" != republish ]]; then
            git config init.defaultBranch "$DEFAULT_BRANCH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi

      - name: Capture source
        id: capture
        if: steps.entry.outputs.mode == 'full-update'
        working-directory: app
        run: |
          echo "Capture input: $(git -C "$ARCHIVE_DIR" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          npm run --silent capture:directory -- --archive-dir "$ARCHIVE_DIR" --feed-url "$FEED_URL" > "$RUNNER_TEMP/capture-result.json"

      - name: Push completed Capture before Render
        id: capture-push
        if: steps.entry.outputs.mode == 'full-update'
        run: bash "$GITHUB_WORKSPACE/control/.github/isolated/persist-stage.sh" capture "$ARCHIVE_DIR"

      - name: Render persisted source offline
        id: render
        if: steps.entry.outputs.mode != 'republish'
        working-directory: app
        run: |
          echo "Render input: $(git -C "$ARCHIVE_DIR" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          npm run --silent render:directory -- --archive-dir "$ARCHIVE_DIR" > "$RUNNER_TEMP/render-result.json"

      - name: Push completed Render before build
        id: render-push
        if: steps.entry.outputs.mode != 'republish'
        run: bash "$GITHUB_WORKSPACE/control/.github/isolated/persist-stage.sh" render "$ARCHIVE_DIR"

      - name: Build complete saved publication with Astro and Pagefind
        id: build
        working-directory: app
        run: >-
          npm run --silent site:build:directory --
          --archive-dir "$ARCHIVE_DIR" --output "$RUNNER_TEMP/site"
          --base "$SITE_BASE" --site "$SITE_ORIGIN"
          > "$RUNNER_TEMP/build-result.json"

      - name: Upload finished native Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: isolated-pages
          path: ${{ runner.temp }}/site

      - name: Record stage counts and build outcome
        if: always()
        env:
          MODE: ${{ steps.entry.outputs.mode }}
          SELECTED: ${{ steps.selected.outputs.revision }}
          CAPTURE_STATUS: ${{ steps.capture.outcome }}
          RENDER_STATUS: ${{ steps.render.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          {
            echo "Capture: $CAPTURE_STATUS; Render: $RENDER_STATUS"
            echo "Skipped stages were not executed; selected saved input: $SELECTED (mode $MODE)."
            echo "Build: $BUILD_STATUS; upload: $UPLOAD_STATUS"
            if [[ "$BUILD_STATUS" != success || "$UPLOAD_STATUS" != success ]]; then
              echo 'Native deployment is blocked by upstream failure or skipped build/upload.'
            else
              echo 'Native deployment is pending the dependent job; inspect its outcome and public content.'
            fi
            for stage in capture render build; do
              if [[ -f "$RUNNER_TEMP/$stage-result.json" ]]; then
                echo "$stage command result (directory success alone is not a confirmed push):"
                echo '```json'
                cat "$RUNNER_TEMP/$stage-result.json"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: archive-build
    if: >-
      github.repository == 'TsaoHoward/copilot-changelog-isolated-35' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy same-workflow native artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: isolated-pages
      - name: Record native outcome
        if: always()
        env:
          STATUS: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "Native deployment: $STATUS"
            echo "Pages URL when returned: $PAGE_URL"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'After an invoked deployment fails or has uncertain status, inspect native status and public article/search before recovery; old bytes are not assumed.'
          } >> "$GITHUB_STEP_SUMMARY"
